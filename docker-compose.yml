services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      DEBUG: "1"
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: bun run start:dev

volumes:
  postgres_data:
  localstack_data:
