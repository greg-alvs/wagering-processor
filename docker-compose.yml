services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wagering}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-app-user-init:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/init-app-user.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-wagering_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local_app_password_change_me}
    volumes:
      - ./scripts/init-app-user.sh:/scripts/init-app-user.sh:ro
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    command: ["bunx", "mikro-orm", "migration:up"]
    restart: "no"

  localstack:
    image: localstack/localstack:3.8
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      DEBUG: "1"
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  sqs-init:
    image: amazon/aws-cli:2.27.49
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-sqs.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      LOCALSTACK_ENDPOINT_URL: http://localstack:4566
      SQS_MAIN_QUEUE_NAME: ${SQS_MAIN_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_QUEUE_NAME: ${SQS_DLQ_QUEUE_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-integration-events.fifo}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
    volumes:
      - ./scripts/init-sqs.sh:/scripts/init-sqs.sh:ro
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-app
    depends_on:
      postgres-app-user-init:
        condition: service_completed_successfully
      sqs-init:
        condition: service_completed_successfully
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-wagering_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local_app_password_change_me}
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_MAIN_QUEUE_NAME: ${SQS_MAIN_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_QUEUE_NAME: ${SQS_DLQ_QUEUE_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-integration-events.fifo}
      SQS_CONSUMER_NAME: ${SQS_CONSUMER_NAME:-wager-transaction-consumer}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
    ports:
      - "3000:3000"
    command: bun run start:dev

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres-app-user-init:
        condition: service_completed_successfully
      sqs-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-wagering_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local_app_password_change_me}
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_MAIN_QUEUE_NAME: ${SQS_MAIN_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_QUEUE_NAME: ${SQS_DLQ_QUEUE_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-integration-events.fifo}
      SQS_CONSUMER_NAME: ${SQS_CONSUMER_NAME:-wager-transaction-consumer}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
    command: ["bun", "test"]
    restart: "no"

volumes:
  postgres_data:
  localstack_data:
